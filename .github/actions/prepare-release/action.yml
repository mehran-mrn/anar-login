name: Prepare Anar Toolkit release
description: Test and package the complete WordPress.org runtime.
inputs:
  tag:
    description: Release tag, optionally prefixed with v.
    required: false
    default: ''
outputs:
  version:
    description: Validated plugin version.
    value: ${{ steps.package.outputs.version }}
  build_dir:
    description: Directory containing only installable files.
    value: ${{ steps.package.outputs.build_dir }}
runs:
  using: composite
  steps:
    - name: Set up PHP
      uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
      with:
        php-version: '8.3'
        coverage: none
        tools: composer:v2
    - name: Validate, install and test
      shell: bash
      run: |
        set -euo pipefail
        composer validate --strict
        composer install --no-interaction --prefer-dist --no-progress
        composer test
        composer phpcs
        for script in assets/js/*.js; do node --check "$script"; done
        python3 tests/test_release.py
    - name: Build installable ZIP
      shell: bash
      run: python3 tools/package.py --output "$RUNNER_TEMP/anar-toolkit.zip"
    - name: Validate tagged release and extract package
      id: package
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        python3 tools/prepare-release.py \
          --tag "$RELEASE_TAG" \
          --package "$RUNNER_TEMP/anar-toolkit.zip" \
          --output "$RUNNER_TEMP/anar-toolkit-release"
